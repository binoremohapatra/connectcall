name: connectcall
description: "ConnectCall — Real-time 1-to-1 audio and video calling app"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3

  # Notifications
  flutter_local_notifications: ^17.2.3

  # Agora RTC Engine
  agora_rtc_engine: ^6.3.2

  # State Management
  flutter_riverpod: ^2.6.1

  # Permissions
  permission_handler: ^11.3.1

  # Image loading
  cached_network_image: ^3.4.1

  # Date formatting
  intl: ^0.19.0

  # HTTP for FCM v1 API
  http: ^1.6.0
  flutter_shader_kit: ^0.1.1
  flutter_shaders: ^0.1.3
  image_picker: ^1.2.3
  shared_preferences: ^2.5.5
  googleapis_auth: ^2.3.3
  google_sign_in: ^6.2.1
  agora_token_service: ^0.1.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0B0D17"
  adaptive_icon_foreground: "assets/icons/logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/background/
    - assets/icons/
    - assets/service_account.json
